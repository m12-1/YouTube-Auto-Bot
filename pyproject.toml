[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-shorts-platform"
version = "1.0.0"
description = "YouTube Shorts generation platform"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "edge-tts>=6.1.0",
    "moviepy>=1.0.3",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "psutil>=5.9.0",
    "apscheduler>=3.10.0"
]

[project.scripts]
ytshorts = "main:main"
