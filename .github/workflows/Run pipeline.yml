name: Run Pipeline

# ─────────────────────────────────────────────
#  Triggers
#  1. Manual trigger from the GitHub Actions UI
#  2. Scheduled daily at 08:00 UTC (optional —
#     delete the `schedule` block if you only
#     want manual runs)
# ─────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      topic:
        description: >
          Topic to generate a Short about.
          Leave empty to let the Topic Selector pick one automatically.
        required: false
        default: ""
        type: string

      category:
        description: "Category hint for the Topic Selector (ignored when topic is set)"
        required: false
        default: "science"
        type: choice
        options:
          - science
          - technology
          - history
          - health
          - space
          - nature
          - psychology
          - economics

      privacy:
        description: "YouTube video privacy after upload"
        required: true
        default: "private"
        type: choice
        options:
          - private      # only you can see it
          - unlisted     # anyone with the link can see it
          - public       # visible to everyone

      dry_run:
        description: "Dry run — render everything but skip the YouTube upload"
        required: false
        default: false
        type: boolean

  schedule:
    # Daily at 08:00 UTC — remove this block if you don't want auto-runs.
    # When triggered by schedule: uses category=science, privacy=private,
    # topic auto-selected by the Topic Selector module.
    - cron: "0 8 * * *"

jobs:
  pipeline:
    runs-on: ubuntu-latest

    # ── required secrets (add these in Settings → Secrets → Actions) ──
    # GEMINI_KEY_ADVANCED, GEMINI_KEY_FILTER, GEMINI_KEY_FILTER_2
    # GEMINI_KEY_IMAGE, GEMINI_KEY_LIGHT
    # PEXELS_API_KEY, PIXABAY_API_KEY
    # YOUTUBE_OAUTH_CLIENT_ID, YOUTUBE_OAUTH_CLIENT_SECRET
    # YOUTUBE_OAUTH_REFRESH_TOKEN
    # All are optional — modules fall back gracefully when a key is missing.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies (ffmpeg, ImageMagick)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg imagemagick

      - name: Relax ImageMagick policy for MoviePy TextClip
        run: |
          # Ubuntu's default ImageMagick policy blocks several operations
          # (including text/label rendering paths MoviePy's TextClip relies
          # on) via /etc/ImageMagick-6/policy.xml. Without this, TextClip
          # calls can still fail even with ImageMagick installed.
          POLICY_FILE="/etc/ImageMagick-6/policy.xml"
          if [ -f "$POLICY_FILE" ]; then
            sudo sed -i 's/rights="none"/rights="read|write"/g' "$POLICY_FILE"
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── resolve inputs (workflow_dispatch vs schedule) ──────────────
      - name: Resolve run parameters
        id: params
        run: |
          # topic: use input if provided, otherwise empty (auto-select)
          TOPIC="${{ github.event.inputs.topic }}"
          # category: use input if provided, default to 'science' for schedule
          CATEGORY="${{ github.event.inputs.category }}"
          CATEGORY="${CATEGORY:-science}"
          # privacy: use input if provided, default to 'private' for schedule
          PRIVACY="${{ github.event.inputs.privacy }}"
          PRIVACY="${PRIVACY:-private}"
          # dry_run: use input if provided, default to false for schedule
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          DRY_RUN="${DRY_RUN:-false}"

          echo "topic=$TOPIC"         >> $GITHUB_OUTPUT
          echo "category=$CATEGORY"   >> $GITHUB_OUTPUT
          echo "privacy=$PRIVACY"     >> $GITHUB_OUTPUT
          echo "dry_run=$DRY_RUN"     >> $GITHUB_OUTPUT

      # ── run the pipeline ────────────────────────────────────────────
      - name: Run pipeline
        env:
          # Gemini
          GEMINI_KEY_ADVANCED: ${{ secrets.GEMINI_KEY_ADVANCED }}
          GEMINI_KEY_FILTER:   ${{ secrets.GEMINI_KEY_FILTER }}
          GEMINI_KEY_FILTER_2: ${{ secrets.GEMINI_KEY_FILTER_2 }}
          GEMINI_KEY_IMAGE:    ${{ secrets.GEMINI_KEY_IMAGE }}
          GEMINI_KEY_LIGHT:    ${{ secrets.GEMINI_KEY_LIGHT }}
          # Media providers
          PEXELS_API_KEY:   ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:  ${{ secrets.PIXABAY_API_KEY }}
          # YouTube OAuth
          YOUTUBE_OAUTH_CLIENT_ID:      ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET:  ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN:  ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
          # Pipeline tuning (optional overrides)
          VIDEO_OUTPUT_DIR: ./output/video
          VOICE_AUDIO_OUTPUT_DIR: ./output/audio
          MEDIA_CACHE_DIR: ./cache/media
          # Privacy and dry-run are passed via env so main.py can read them
          PIPELINE_PRIVACY: ${{ steps.params.outputs.privacy }}
          PIPELINE_DRY_RUN: ${{ steps.params.outputs.dry_run }}
        run: |
          python main.py \
            --category "${{ steps.params.outputs.category }}" \
            ${{ steps.params.outputs.topic != '' && format('--topic "{0}"', steps.params.outputs.topic) || '' }} \
            --privacy "${{ steps.params.outputs.privacy }}" \
            ${{ steps.params.outputs.dry_run == 'true' && '--dry-run' || '' }}

      # ── upload artifacts so you can download the MP4 from GitHub ────
      - name: Upload output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ github.run_id }}
          path: |
            output/
            !output/**/*.tmp
          retention-days: 7
