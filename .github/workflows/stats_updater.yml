name: Video Stats Updater (24h/48h/72h)

on:
  schedule:
    - cron: "0 * * * *"   # كل ساعة
  workflow_dispatch: {}

concurrency:
  group: stats-updater
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Validate required secrets before running
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          YOUTUBE_SEARCH_API_KEY: ${{ secrets.YOUTUBE_SEARCH_API_KEY }}
        run: |
          echo "== فحص الأسرار الأساسية (لا يطبع أي قيمة حساسة) =="

          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "❌ GOOGLE_SERVICE_ACCOUNT_JSON غير موجود أو فارغ في أسرار هذا المستودع."
            echo "   تحقق: Settings → Secrets and variables → Actions → Repository secrets"
            echo "   وتأكد إن الاسم مطابق حرفيًا: GOOGLE_SERVICE_ACCOUNT_JSON"
            exit 1
          fi

          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" | python3 -c "
          import json, sys
          raw = sys.stdin.read()
          try:
              data = json.loads(raw)
          except json.JSONDecodeError as e:
              print(f'❌ GOOGLE_SERVICE_ACCOUNT_JSON موجود لكنه ليس JSON صالحًا: {e}')
              sys.exit(1)
          required_keys = ['type', 'project_id', 'private_key', 'client_email']
          missing = [k for k in required_keys if k not in data]
          if missing:
              print(f'❌ GOOGLE_SERVICE_ACCOUNT_JSON ناقص حقولًا أساسية: {missing}')
              sys.exit(1)
          print(f'✅ GOOGLE_SERVICE_ACCOUNT_JSON صالح (client_email: {data[\"client_email\"]})')
          "

          if [ -z "$SPREADSHEET_ID" ]; then
            echo "❌ SPREADSHEET_ID غير موجود أو فارغ."
            exit 1
          fi
          echo "✅ SPREADSHEET_ID موجود."

          if [ -z "$YOUTUBE_SEARCH_API_KEY" ]; then
            echo "❌ YOUTUBE_SEARCH_API_KEY غير موجود أو فارغ."
            exit 1
          fi
          echo "✅ YOUTUBE_SEARCH_API_KEY موجود."

          echo "== كل الأسرار الأساسية سليمة - المتابعة للتشغيل الفعلي =="

      - name: Update video stats
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          YOUTUBE_SEARCH_API_KEY: ${{ secrets.YOUTUBE_SEARCH_API_KEY }}
          # اختياري: يُفعّل جلب retention الحقيقي إن أُضيف (راجع planner/README.md)
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ANALYTICS_REFRESH_TOKEN }}
        run: python -m planner.stats_updater
