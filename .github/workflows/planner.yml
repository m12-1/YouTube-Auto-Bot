name: Content Planner (Weekly/Monthly)

on:
  schedule:
    - cron: "0 */6 * * *"   # فحص كل 6 ساعات: هل انتهت الخطة الحالية؟
  workflow_dispatch: {}

concurrency:
  group: content-planner
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run weekly/monthly planner
        env:
          GEMINI_KEY_ADVANCED: ${{ secrets.GEMINI_KEY_ADVANCED }}
          GEMINI_KEY_FILTER: ${{ secrets.GEMINI_KEY_FILTER }}
          GEMINI_KEY_FILTER_2: ${{ secrets.GEMINI_KEY_FILTER_2 }}
          GEMINI_KEY_IMAGE: ${{ secrets.GEMINI_KEY_IMAGE }}
          GEMINI_KEY_LIGHT: ${{ secrets.GEMINI_KEY_LIGHT }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python -m planner.weekly_planner
